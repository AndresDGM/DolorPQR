services:
  postgres:
    image: postgres:16-alpine
    container_name: mipqr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-mipqr}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - mipqr-pgdata:/var/lib/postgresql/data

volumes:
  mipqr-pgdata:
